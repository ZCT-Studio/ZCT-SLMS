services:
  verifier:
    build:
      context: .
      args:
        ZCT_SLMS_DATABASE_FEATURES: "postgres;mysql"
        BUILD_JOBS: "2"
    image: zct-slms:local
    restart: unless-stopped
    init: true
    ports:
      - "${ZCT_SLMS_BIND_ADDRESS:-127.0.0.1}:${ZCT_SLMS_PORT:-17112}:17112"
    volumes:
      - zct_slms-config:/app/config
      - zct_slms-data:/app/data
      - zct_slms-logs:/app/logs
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  zct_slms-config:
  zct_slms-data:
  zct_slms-logs:
