            - uses: actions/upload-artifact@v4
              with:
                  name: ZCT-SLMS-macos-x64
                  path: dist

    docker:
        name: Docker build / tag publish
        needs: [windows-x64, windows-x86, windows-arm64, linux-x64, linux-x86, linux-arm64, linux-arm, macos-arm64, macos-x64]
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4
              with: { submodules: recursive }
            - uses: docker/setup-buildx-action@v3
            - name: Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/zct-studio/zct-slms
                  tags: |
                      type=ref,event=tag
                      type=ref,event=pr
                      type=sha,prefix=sha-
                      type=raw,value=latest,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            - name: Log in to GHCR (tags only)
              if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Build image; push only for v* tag
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: Dockerfile
                  platforms: linux/amd64
                  push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    release:
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        needs: [windows-x64, windows-x86, windows-arm64, linux-x64, linux-x86, linux-arm64, linux-arm, macos-arm64, macos-x64, docker]
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  pattern: ZCT-SLMS-*
                  path: artifacts
            - name: Archive each platform separately
              shell: bash
              run: |
                  mkdir -p release
                  for directory in artifacts/*; do
                    test -d "$directory" || continue
                    case "$(basename "$directory")" in
                      *-windows-*) ;;
                      *) chmod +x "$directory/ZCT-SLMS" ;;
                    esac
                    tar -czf "release/$(basename "$directory").tar.gz" -C "$directory" .
                  done
                  test -n "$(find release -name '*.tar.gz' -print -quit)"
            - name: Create Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ github.ref_name }}
                  name: ZCT-SLMS ${{ github.ref_name }}
                  files: release/*.tar.gz
                  fail_on_unmatched_files: true
                  prerelease: ${{ contains(github.ref_name, '-') }}
