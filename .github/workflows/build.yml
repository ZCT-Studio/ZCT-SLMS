name: Build and Release

on:
  push:
    branches:
      - '**'
      - '!main'
      - '!main-*'
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
    windows-x64:
        runs-on: windows-2022
        steps:
            - uses: actions/checkout@v4
              with: { submodules: recursive }
            - uses: lukka/get-cmake@latest
            - name: vcpkg install
              shell: pwsh
              run: |
                  git clone --depth 1 --branch 2025.06.13 https://github.com/microsoft/vcpkg.git
                  ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
                  ./vcpkg/vcpkg install --x-feature=postgres --x-feature=mysql --triplet=x64-windows-static --x-manifest-root="${{ github.workspace }}"
            - name: Configure
              shell: pwsh
              run: cmake -B build -S . -A x64 -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DCMAKE_BUILD_TYPE=Release
            - name: Build
              shell: pwsh
              run: cmake --build build --config Release -j
            - name: Package
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force dist | Out-Null
                  Copy-Item build/bin/Release/ZCT-SLMS.exe dist/
                  Copy-Item config dist/config -Recurse
                  Copy-Item migrations dist/migrations -Recurse
                  Copy-Item README dist/README -Recurse -ErrorAction SilentlyContinue
                  Copy-Item README.md dist/README/README.zh-CN.md -ErrorAction SilentlyContinue
                  Copy-Item LICENSE dist/LICENSE.TXT -ErrorAction SilentlyContinue
            - uses: actions/upload-artifact@v4
              with:
                  name: ZCT-SLMS-windows-x64
                  path: dist
    
    linux-x64:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
              with: { submodules: recursive }
            - uses: lukka/get-cmake@latest
            - name: vcpkg install
              run: |
                  git clone --depth 1 --branch 2025.06.13 https://github.com/microsoft/vcpkg.git
                  # bootstrap downloads can fail transiently (for example HTTP 504).
                  for attempt in 1 2 3 4; do
                    if ./vcpkg/bootstrap-vcpkg.sh -disableMetrics; then
                      break
                    fi
                    if [ "$attempt" -eq 4 ]; then
                      exit 1
                    fi
                    sleep "$((attempt * 5))"
                  done
                  ./vcpkg/vcpkg install --x-feature=postgres --x-feature=mysql --triplet=x64-linux --x-manifest-root="${{ github.workspace }}"
            - name: Configure
              run: cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-linux -DCMAKE_BUILD_TYPE=Release
            - name: Build
              run: cmake --build build -j
            - name: Package
              run: |
                  mkdir -p dist
                  cp build/ZCT-SLMS dist/
                  cp -r config dist/config
                  cp -r migrations dist/migrations
                  cp -r README dist/README 2>/dev/null || true
                  cp README.md dist/README/README.zh-CN.md 2>/dev/null || true
                  cp LICENSE dist/LICENSE.TXT 2>/dev/null || true
            - uses: actions/upload-artifact@v4
              with:
                  name: ZCT-SLMS-linux-x64
                  path: dist
    
    linux-arm64:
        runs-on: ubuntu-24.04-arm
        steps:
            - uses: actions/checkout@v4
              with: { submodules: recursive }
            - uses: lukka/get-cmake@latest
            - name: vcpkg install
              run: |
                  git clone --depth 1 --branch 2025.06.13 https://github.com/microsoft/vcpkg.git
                  # bootstrap downloads can fail transiently (for example HTTP 504).
                  for attempt in 1 2 3 4; do
                    if ./vcpkg/bootstrap-vcpkg.sh -disableMetrics; then
                      break
                    fi
                    if [ "$attempt" -eq 4 ]; then
                      exit 1
                    fi
                    sleep "$((attempt * 5))"
                  done
                  ./vcpkg/vcpkg install --x-feature=postgres --x-feature=mysql --triplet=arm64-linux --x-manifest-root="${{ github.workspace }}"
            - name: Configure
              run: cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=arm64-linux -DCMAKE_BUILD_TYPE=Release
            - name: Build
              run: cmake --build build -j
            - name: Package
              run: |
                  mkdir -p dist
                  cp build/ZCT-SLMS dist/
                  cp -r config dist/config
                  cp -r migrations dist/migrations
                  cp -r README dist/README 2>/dev/null || true
                  cp README.md dist/README/README.zh-CN.md 2>/dev/null || true
                  cp LICENSE dist/LICENSE.TXT 2>/dev/null || true
            - uses: actions/upload-artifact@v4
              with:
                  name: ZCT-SLMS-linux-arm64
                  path: dist
    
    docker-linux:
        name: Docker Linux ${{ matrix.arch }}
        needs: [windows-x64, linux-x64, linux-arm64]
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: amd64
                      runner: ubuntu-24.04
                    - arch: arm64
                      runner: ubuntu-24.04-arm
        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4
              with: { submodules: recursive }
            - uses: docker/setup-buildx-action@v3
            - name: Platform image metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/zct-studio/zct-slms
                  flavor: |
                      latest=false
                      suffix=-linux-${{ matrix.arch }}
                  tags: |
                      type=ref,event=tag
                      type=ref,event=pr
                      type=sha,prefix=sha-
            - name: Build and load platform image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: Dockerfile
                  platforms: linux/${{ matrix.arch }}
                  load: true
                  push: false
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=linux-${{ matrix.arch }}
                  cache-to: type=gha,scope=linux-${{ matrix.arch }},mode=max
            - name: Smoke test platform image
              env:
                  IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
              shell: bash
              run: |
                  image="$(printf '%s\n' "$IMAGE_TAGS" | head -n 1)"
                  container="$(docker run -d "$image")"
                  trap 'docker rm -f "$container" >/dev/null' EXIT
                  for attempt in $(seq 1 30); do
                    if docker exec "$container" curl --fail --silent http://127.0.0.1:17112/api/v1/ping; then
                      exit 0
                    fi
                    sleep 2
                  done
                  echo 'Container did not become ready' >&2
                  exit 1
            - name: Log in to GHCR (tags only)
              if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Push verified platform image (tags only)
              if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
              env:
                  IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
              shell: bash
              run: |
                  while IFS= read -r image; do
                    test -z "$image" || docker push "$image"
                  done <<< "$IMAGE_TAGS"

    docker:
        name: Publish multi-platform Docker index
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        needs: [docker-linux]
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            packages: write
        steps:
            - uses: docker/setup-buildx-action@v3
            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Combine verified Linux images
              env:
                  VERSION: ${{ github.ref_name }}
              shell: bash
              run: |
                  image=ghcr.io/zct-studio/zct-slms
                  docker buildx imagetools create --tag "$image:$VERSION" \
                    "$image:$VERSION-linux-amd64" \
                    "$image:$VERSION-linux-arm64"
                  # Any tag containing '-' is a prerelease and must not replace latest.
                  if [[ "$VERSION" != *-* ]]; then
                    docker buildx imagetools create --tag "$image:latest" "$image:$VERSION"
                  fi

    release:
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        needs: [windows-x64, linux-x64, linux-arm64, docker]
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  pattern: ZCT-SLMS-*
                  path: artifacts
            - name: Archive each platform separately
              shell: bash
              run: |
                  mkdir -p release
                  for directory in artifacts/*; do
                    test -d "$directory" || continue
                    case "$(basename "$directory")" in
                      *-windows-*) ;;
                      *) chmod +x "$directory/ZCT-SLMS" ;;
                    esac
                    tar -czf "release/$(basename "$directory").tar.gz" -C "$directory" .
                  done
                  test -n "$(find release -name '*.tar.gz' -print -quit)"
            - name: Create Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ github.ref_name }}
                  name: ZCT-SLMS ${{ github.ref_name }}
                  files: release/*.tar.gz
                  fail_on_unmatched_files: true
                  prerelease: ${{ contains(github.ref_name, '-') }}
